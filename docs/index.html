<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AdyOS documentation">
  <title>AdyOS Docs</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">Loading AdyOS documentation...</div>
  <script>
    window.$docsify = {
      name: 'AdyOS',
      repo: '',
      loadSidebar: true,
      relativePath: true,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      themeColor: '#b7410e',
      search: {
        paths: 'auto',
        placeholder: 'Search',
        noData: 'No results',
        depth: 3
      }
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
